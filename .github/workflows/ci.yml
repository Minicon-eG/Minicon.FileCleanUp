name: Build, test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: dotnet test -c Release --logger "trx;LogFileName=tests.trx"
      - name: Verify C# formatting
        run: dotnet format whitespace --no-restore --verify-no-changes
      - name: Verify explicit control-flow braces
        run: dotnet format style --no-restore --verify-no-changes --diagnostics IDE0011
      - run: dotnet build samples/Minicon.FileCleanUp.Console -c Release
      - run: python scripts/package-smoke.py
      - run: python scripts/host-smoke.py
      - name: Windows storage acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-storage-smoke.ps1
